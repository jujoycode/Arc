spring:
  application:
    name: arc-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/arc?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME:arc}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

arc:
  public-url: ${ARC_PUBLIC_URL:http://localhost:5173}
  mail-from: ${ARC_MAIL_FROM:arcat <no-reply@localhost>}
  integrations:
    encryption-key: ${ARC_INTEGRATION_ENCRYPTION_KEY:}
    github-api-url: ${ARC_PROVIDER_GITHUB_API_URL:https://api.github.com}
    gitlab-api-url: ${ARC_PROVIDER_GITLAB_API_URL:https://gitlab.com/api/v4}

management:
  endpoints:
    web:
      exposure:
        include: health
