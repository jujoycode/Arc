name: arc
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: arc
      MYSQL_USER: arc
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -u $$MYSQL_USER --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
  backend:
    image: arc-backend:${ARC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/arc?useUnicode=true&characterEncoding=utf8
      DB_USERNAME: arc
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ARC_PUBLIC_URL: ${ARC_PUBLIC_URL:?Set ARC_PUBLIC_URL}
      ARC_MAIL_FROM: ${ARC_MAIL_FROM:-Arc <no-reply@localhost>}
      ARC_INTEGRATION_ENCRYPTION_KEY: ${ARC_INTEGRATION_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    mem_limit: 1g
  web:
    image: arc-web:${ARC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ARC_HTTP_BIND:-127.0.0.1}:${ARC_HTTP_PORT:-8085}:8080"
    mem_limit: 256m
  mailpit:
    image: axllent/mailpit:v1.28
    profiles: [local-mail]
    ports:
      - "127.0.0.1:${ARC_MAILPIT_PORT:-8026}:8025"
    mem_limit: 128m

volumes:
  mysql_data:
